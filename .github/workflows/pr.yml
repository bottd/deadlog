name: Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pipeline
        uses: ./.github/actions/setup-pipeline
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate database once
        run: pnpm run build:db

      - name: Check types and lint
        run: pnpm run check && pnpm run lint

      - name: Run tests
        run: pnpm run test
        env:
          NODE_ENV: test

      - name: Build web
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Run browser tests against the build
        run: pnpm run test:e2e

  auto-merge:
    needs: pull-request
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'automated')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
