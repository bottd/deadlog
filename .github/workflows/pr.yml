name: Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pipeline
        uses: ./.github/actions/setup-pipeline
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate database once
        run: deadlog db

      - name: Check formatting
        run: nix flake check

      - name: Run tests
        run: cargo test --release --locked --workspace

      - name: Build site
        run: deadlog build

      - name: Run browser tests against the build
        working-directory: e2e
        run: npm ci && npx playwright test

  auto-merge:
    needs: pull-request
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'automated')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
