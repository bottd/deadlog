name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# The update check and deployment share the same checkout and generated artifacts.
# Preserve queued pushes when a scheduled check arrives and finds no content changes.
concurrency:
  group: deploy
  queue: max
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Setup pipeline
        uses: ./.github/actions/setup-pipeline
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare changelogs and database
        id: data
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            pnpm run build:scraper --if-changed
          else
            pnpm run build:db
          fi

      - name: Verify implementation
        if: steps.data.outputs.changed == 'true'
        run: pnpm run check && pnpm run lint && pnpm run test

      - name: Generate social preview images
        if: steps.data.outputs.changed == 'true'
        run: pnpm run build:meta

      - name: Build web project
        if: steps.data.outputs.changed == 'true'
        run: pnpm run build
        env:
          CLOUDFLARE: true

      - name: Deploy to Cloudflare Workers
        if: steps.data.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config=app/wrangler.toml

      - name: Persist deployed scheduled changelogs
        if: github.event_name == 'schedule' && steps.data.outputs.changed == 'true'
        run: |
          if [[ -n "$(git status --porcelain -- app/changelogs)" ]]; then
            git add app/changelogs
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update scraped changelogs [skip ci]'
            git push origin HEAD:main
          fi
