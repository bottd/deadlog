name: Build and Deploy

on:
  push:
    branches: [main]

  # Run every hour to check for new announcements
  schedule:
    - cron: '0 * * * *'

  # Allow manual triggering
  workflow_dispatch:

jobs:
  check-for-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}

    steps:
      - name: Checkout current main
        if: github.event_name == 'schedule'
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Setup pipeline
        if: github.event_name == 'schedule'
        uses: ./.github/actions/setup-pipeline
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for new changelogs
        if: github.event_name == 'schedule'
        run: pnpm run build:scraper
        env:
          DATABASE_URL: file:app/static/deadlog.db

      - name: Decide whether to deploy
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]] || [[ -n "$(git status --porcelain -- app/changelogs)" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No new changelogs; skipping the scheduled deployment."
          fi

  build-and-deploy:
    needs: check-for-updates
    if: needs.check-for-updates.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Setup pipeline
        uses: ./.github/actions/setup-pipeline
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run type checking
        run: pnpm run check

      - name: Run lint
        run: pnpm run lint

      - name: Scrape changelogs and generate database
        if: github.event_name == 'schedule'
        run: pnpm run build:scraper
        env:
          DATABASE_URL: file:app/static/deadlog.db

      - name: Generate database
        if: github.event_name != 'schedule'
        run: pnpm run build:db
        env:
          DATABASE_URL: file:app/static/deadlog.db

      - name: Generate social preview images
        run: pnpm run build:meta
        env:
          DATABASE_URL: file:app/static/deadlog.db

      - name: Build web project
        run: pnpm run build
        env:
          CLOUDFLARE: true
          DATABASE_URL: file:app/static/deadlog.db

      - name: Persist scheduled changelogs
        if: github.event_name == 'schedule'
        run: |
          if [[ -n "$(git status --porcelain -- app/changelogs)" ]]; then
            git add app/changelogs
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update scraped changelogs [skip ci]'
            git push origin HEAD:main
          else
            echo "Changelogs were already persisted by an earlier run."
          fi

      - name: Export database to SQL
        run: |
          sqlite3 app/static/deadlog.db .dump > deadlog.sql
          grep -v -E "^(BEGIN|COMMIT|ROLLBACK|SAVEPOINT)" deadlog.sql > deadlog-clean.sql
          cat lib/db/drop-tables.sql deadlog-clean.sql > deadlog-replace.sql

      - name: Replace D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 execute deadlog --remote --file=deadlog-replace.sql --config=app/wrangler.toml

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config=app/wrangler.toml
