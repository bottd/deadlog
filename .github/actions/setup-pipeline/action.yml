name: Setup Pipeline
description: Setup the Nix environment and build the deadlog binary

inputs:
  github-token:
    description: GitHub token for Nix installation
    required: true

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31.11.1
      with:
        github_access_token: ${{ inputs.github-token }}

    - name: Setup Cachix
      uses: cachix/cachix-action@v17
      with:
        name: deadlog

    - name: Setup Nix dev environment
      uses: nicknovitski/nix-develop@v1.2.1

    - name: Cache Cargo build
      uses: Swatinem/rust-cache@v2.8.1

    - name: Build deadlog
      shell: bash
      run: |
        cargo build --release --locked --bin deadlog
        echo "$PWD/target/release" >> "$GITHUB_PATH"
