[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
askama = "0.16"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
rayon = "1"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
deadlog-model = { path = "crates/model" }
deadlog-db = { path = "crates/db" }
deadlog-site = { path = "crates/site" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 16

# vite-plugin-mog pins mog-parser to a rev that predates the span work its own
# source needs (it builds against a local checkout); point it at the pushed commit.
[patch."https://github.com/bottd/mog.git"]
mog-parser = { git = "https://www.github.com/bottd/mog", rev = "e93189605ea6a40cc958b0bfdb56b018b12225bd" }
