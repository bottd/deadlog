# deadlog.io is a static site: the Worker serves `dist/` as assets with no code of its
# own. `_redirects` carries the changelog aliases, `_headers` HSTS and immutable
# caching for hashed assets, and 404.html answers every unknown path.
name = "deadlog"
compatibility_date = "2026-09-01"

[assets]
directory = "dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
