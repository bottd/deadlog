<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>{% block title %}Deadlog{% endblock %}</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Oswald:wght@500&display=swap"
		/>
		<link rel="stylesheet" href="/assets/site.css" />
		<script src="/assets/htmx.min.js" defer></script>
	</head>
	<body>
		<header class="site-header">
			<a class="wordmark" href="/">dead<span>log</span></a>
			<nav aria-label="Primary"><a href="/heroes/">Heroes</a></nav>
		</header>
		<main class="page">{% block main %}{% endblock %}</main>
		<footer class="site-footer">
			<p>
				Deadlog is an independent community project. Deadlock is a trademark of Valve
				Corporation.
			</p>
			<p>
				Entity and match data from the
				<a href="https://deadlock-api.com" rel="noopener">Deadlock API</a>.
			</p>
		</footer>
	</body>
</html>
