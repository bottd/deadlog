{% extends "base.html" %} {% block title %}Deadlock heroes | Deadlog{% endblock %} {%
block main %}
<h1 class="display">Heroes</h1>
<ul class="directory">
	{% for hero in heroes %}
	<li>
		<a href="/hero/{{ hero.slug }}/"
			><img src="{{ hero.icon }}" alt="" width="40" height="40" loading="lazy" />{{
			hero.name }}</a
		>
	</li>
	{% endfor %}
</ul>
{% endblock %}
