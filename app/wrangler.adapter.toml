# Build-only config: adapter-cloudflare writes its generated worker here. The deployed
# entrypoint in wrangler.toml wraps it with the canonical-origin redirect.
name = "deadlog-sveltekit"
compatibility_date = "2025-04-03"
compatibility_flags = ["nodejs_compat"]
main = ".svelte-kit/cloudflare/_worker.js"

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"
