# Build-only config: adapter-cloudflare writes its generated worker here. The deployed
# entrypoint in wrangler.toml wraps it with the canonical-origin redirect.
name = "deadlog-sveltekit"
compatibility_date = "2025-04-03"
compatibility_flags = ["nodejs_compat"]
main = ".svelte-kit/cloudflare/_worker.js"

[[d1_databases]]
binding = "DB"
database_name = "deadlog"
database_id = "e5334011-294b-4fca-9e36-2ebdd5c48886"

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"
