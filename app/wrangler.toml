name = "deadlog"
compatibility_date = "2025-04-03"
compatibility_flags = ["nodejs_compat", "enable_ctx_exports"]
main = "cloudflare-worker.ts"

[cache]
enabled = true

[exports.default]
type = "worker"

  [exports.default.cache]
  enabled = false

[exports.SvelteKit]
type = "worker"

  [exports.SvelteKit.cache]
  enabled = true

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[vars]
PUBLIC_COUNTERSCALE_SITE_ID = "deadlog-io"
PUBLIC_COUNTERSCALE_REPORTER_URL = "https://a.drake.dev/collect"

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"
run_worker_first = true
