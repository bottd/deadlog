{%- macro svg(name, class) -%}
<svg
	xmlns="http://www.w3.org/2000/svg"
	width="24"
	height="24"
	viewBox="0 0 24 24"
	fill="none"
	stroke="currentColor"
	stroke-width="2"
	stroke-linecap="round"
	stroke-linejoin="round"
	class="lucide lucide-{{ name }} lucide-icon {{ class }}"
	aria-hidden="true"
>
	{%- match name -%} {%- when "arrow-left" -%}
	<path d="m12 19-7-7 7-7"></path>
	<path d="M19 12H5"></path>
	{%- when "arrow-right" -%}
	<path d="M5 12h14"></path>
	<path d="m12 5 7 7-7 7"></path>
	{%- when "arrow-up" -%}
	<path d="m5 12 7-7 7 7"></path>
	<path d="M12 19V5"></path>
	{%- when "chevron-right" -%}
	<path d="m9 18 6-6-6-6"></path>
	{%- when "crosshair" -%}
	<circle cx="12" cy="12" r="10"></circle>
	<line x1="22" x2="18" y1="12" y2="12"></line>
	<line x1="6" x2="2" y1="12" y2="12"></line>
	<line x1="12" x2="12" y1="6" y2="2"></line>
	<line x1="12" x2="12" y1="22" y2="18"></line>
	{%- when "search" -%}
	<path d="m21 21-4.34-4.34"></path>
	<circle cx="11" cy="11" r="8"></circle>
	{%- when "search-x" -%}
	<path d="m13.5 8.5-5 5"></path>
	<path d="m8.5 8.5 5 5"></path>
	<circle cx="11" cy="11" r="8"></circle>
	<path d="m21 21-4.3-4.3"></path>
	{%- when "x" -%}
	<path d="M18 6 6 18"></path>
	<path d="m6 6 12 12"></path>
	{%- when "external-link" -%}
	<path d="M15 3h6v6"></path>
	<path d="M10 14 21 3"></path>
	<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
	{%- when "link" -%}
	<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
	<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
	{%- when "list" -%}
	<path d="M3 5h.01"></path>
	<path d="M3 12h.01"></path>
	<path d="M3 19h.01"></path>
	<path d="M8 5h13"></path>
	<path d="M8 12h13"></path>
	<path d="M8 19h13"></path>
	{%- when "frown" -%}
	<path d="M15 10V9"></path>
	<path d="M9 10V9"></path>
	<path d="M9 16a5 5 0 016 0"></path>
	<circle cx="12" cy="12" r="10"></circle>
	{%- when "clapperboard" -%}
	<path d="m12.296 3.464 3.02 3.956"></path>
	<path
		d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3z"
	></path>
	<path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
	<path d="m6.18 5.276 3.1 3.899"></path>
	{%- when "triangle-alert" -%}
	<path
		d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"
	></path>
	<path d="M12 9v4"></path>
	<path d="M12 17h.01"></path>
	{%- else -%} {%- endmatch -%}
</svg>
{%- endmacro -%} {%- macro corner_accents(tl_size, br_size, tl_color, br_color, tl_hover,
br_hover, thickness) -%}
<div
	class="absolute top-0 left-0 {{ tl_color }}{% if !tl_hover.is_empty() %} {{ tl_hover }}{% endif %} transition-colors duration-300"
	style="height: {{ tl_size }}; width: {{ thickness }};"
	aria-hidden="true"
></div>
<div
	class="absolute top-0 left-0 {{ tl_color }}{% if !tl_hover.is_empty() %} {{ tl_hover }}{% endif %} transition-colors duration-300"
	style="height: {{ thickness }}; width: {{ tl_size }};"
	aria-hidden="true"
></div>
{%- if !br_size.is_empty() -%}
<div
	class="absolute right-0 bottom-0 {{ br_color }}{% if !br_hover.is_empty() %} {{ br_hover }}{% endif %} transition-colors duration-300"
	style="height: {{ br_size }}; width: {{ thickness }};"
	aria-hidden="true"
></div>
<div
	class="absolute right-0 bottom-0 {{ br_color }}{% if !br_hover.is_empty() %} {{ br_hover }}{% endif %} transition-colors duration-300"
	style="height: {{ thickness }}; width: {{ br_size }};"
	aria-hidden="true"
></div>
{%- endif -%} {%- endmacro -%}
