[package]
name = "deadlog-site"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
serve = ["dep:axum", "dep:tokio", "dep:tower", "dep:tower-http", "dep:tower-livereload", "dep:notify"]

[dependencies]
anyhow.workspace = true
askama.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
deadlog-changelog = { path = "../changelog" }
deadlog-db.workspace = true
deadlog-model.workspace = true
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["bundler"] }
mog = { package = "vite-plugin-mog-parser", git = "https://github.com/bottd/vite-plugin-mog", rev = "5ff1042a166eb197beabf0a116308436293a90f0" }
rayon.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
axum = { version = "0.8", optional = true }
notify = { version = "8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
tower-livereload = { version = "0.10", optional = true }

[dev-dependencies]
insta = "1"
rquickjs = "0.9"
rusqlite.workspace = true
