packages:
  - app
  - lib/*

allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types*'
  - svelte-check*
  - miniflare*
  - wrangler*
  - vite-plugin-mog*

onlyBuiltDependencies:
  - deadlock_api_client
  - esbuild
  - msw
  - sharp
  - workerd
